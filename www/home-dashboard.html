<!DOCTYPE html>
<html lang="en">
<head>
  <script src="rm-env.js?v=20261021b"></script>
  <script src="rm-bugs.js?v=20261022b"></script>
  <!-- DRAFT (staging only): the Home dashboard that replaces the Feed on staging.
       Production never opens this page — app-shell.js and home.html only switch
       to it when RM_ENV.name === 'staging'. Remove = revert its commit. -->
  <script>if (!window.RM_ENV || window.RM_ENV.name !== 'staging') location.replace('home.html');</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>realmate | Home</title>
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css?v=6.5.0">
  <link rel="stylesheet" href="vendor/googlefonts/fonts.css?v=1">
  <script src="theme.js?v=20260812a"></script>
  <script src="toast.js?v=20261001a"></script>
  <link rel="stylesheet" href="safe-area.css?v=20260915d">
  <script>if(window.self!==window.top)document.documentElement.classList.add("rm-embedded");</script>
  <link rel="stylesheet" href="desktop-nav.css?v=20260928a">
  <link rel="stylesheet" href="home-dashboard.css?v=20261028c">
</head>
<body>

<main class="hd" id="hd">
  <header class="hd-hero">
    <div class="hd-hero-top">
      <img class="hd-logo" src="images/realmate2.png" alt="realmate">
      <time class="hd-date" id="hdDate"></time>
    </div>
    <h1 class="hd-greet" id="hdGreet">Hello.</h1>
    <p class="hd-sub">Here's your real estate market today.</p>
  </header>

  <section class="hd-card hd-overview" aria-label="Market overview">
    <div class="hd-stat" onclick="hdOpenPortal()"><span class="hd-stat-ico"><i class="fas fa-user"></i></span><div><div class="hd-stat-num"><b id="hdReqN">–</b><em id="hdReqD" hidden></em></div><div class="hd-stat-lbl">New Requirements</div></div></div>
    <div class="hd-stat" onclick="hdOpenPortal()"><span class="hd-stat-ico"><i class="fas fa-house"></i></span><div><div class="hd-stat-num"><b id="hdLstN">–</b><em id="hdLstD" hidden></em></div><div class="hd-stat-lbl">New Listings</div></div></div>
    <div class="hd-stat" onclick="hdOpenPortal('AI_ENGINE')"><span class="hd-stat-ico hd-ico-ai"><i class="fas fa-wand-magic-sparkles"></i></span><div><div class="hd-stat-num"><b id="hdAiN">–</b><em id="hdAiD" hidden></em></div><div class="hd-stat-lbl">AI Matches</div></div></div>
    <div class="hd-stat" onclick="hdOpenPortal()"><span class="hd-stat-ico"><i class="fas fa-chart-simple"></i></span><div><div class="hd-stat-num"><b id="hdOppN">–</b><em id="hdOppD" hidden></em></div><div class="hd-stat-lbl">Active Opportunities</div></div></div>
    <p class="hd-overview-note">New = posted in the last 7 days · green = added today</p>
  </section>

  <!-- Home video: the YouTube link an admin saves in Admin › Home Video
       (site_settings 'youtube_url'). Hidden when none is set. -->
  <section class="hd-sec" id="hdVideoSec" hidden>
    <div class="hd-video"><iframe id="hdVideo" title="realmate video" loading="lazy"
      referrerpolicy="strict-origin-when-cross-origin" allowfullscreen
      allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"></iframe></div>
  </section>

  <section class="hd-sec">
    <div class="hd-sec-head"><h2><i class="fas fa-fire hd-fire"></i> Hot Requirements</h2><button class="hd-link" onclick="hdOpenPortal()">View All <i class="fas fa-chevron-right"></i></button></div>
    <div class="hd-rail" id="hdReqRail"><div class="hd-skel"></div><div class="hd-skel"></div></div>
  </section>

  <section class="hd-sec">
    <div class="hd-sec-head"><h2><i class="fas fa-wand-magic-sparkles hd-spark"></i> Your AI Matches</h2><button class="hd-link" onclick="hdOpenPortal('AI_ENGINE')">View All <i class="fas fa-chevron-right"></i></button></div>
    <div class="hd-rail" id="hdAiRail"><div class="hd-skel hd-skel-tall"></div><div class="hd-skel hd-skel-tall"></div></div>
  </section>
</main>

<!-- Desktop / standalone navigation (the app shell hides this and shows its own). -->
<nav class="mobile-bottom-nav">
  <a class="mob-nav-item active" href="home-dashboard.html"><i class="fas fa-house"></i><span>Home</span></a>
  <a class="mob-nav-item" href="chat.html"><i class="fas fa-comment-dots"></i><span>Chat</span></a>
  <a class="mob-nav-item mob-nav-center" href="livemarket.html"><i class="fas fa-globe"></i><span>Portal</span></a>
  <a class="mob-nav-item" href="notifications.html"><i class="fas fa-bell"></i><span>Notifications</span></a>
  <div class="mob-nav-item mob-nav-avatar-wrap" onclick="toggleNavMenu(event)">
    <div class="mob-nav-avatar" id="navAvatar"><i class="fas fa-user-tie" style="font-size:13px;"></i></div>
    <span>Me</span>
    <div class="mob-nav-menu" id="navMenu">
      <a href="dashboard.html"><i class="fas fa-user-tie"></i> Profile</a>
      <a href="realmates.html"><i class="fas fa-user-group"></i> realmates</a>
      <a href="settings.html"><i class="fas fa-cog"></i> Settings</a>
      <a href="#" onclick="event.preventDefault(); logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>
  </div>
</nav>

<script src="vendor/supabase-js.min.js?v=2.112.3"></script>
<script src="auth-guard.js?v=20261021d"></script>
<script src="visibility.js?v=20261002a"></script>
<script src="deactivation.js?v=20261019e"></script>
<script src="block-report.js?v=20261019e"></script>
<script src="location-engine.js?v=20260809b"></script>
<script src="developers.js?v=36"></script>
<script src="match-engine.js?v=20261022b"></script>
<script src="notif-badge.js?v=20261019e"></script>
<script src="nav-menu.js?v=20260930a"></script>
<script src="rm-youtube.js?v=20261028a"></script>
<script src="home-dashboard.js?v=20261028c"></script>
</body>
</html>
