  <!-- home.css carries the .mobile-bottom-nav styling; the shell layout below
       overrides html/body so the feed layout rules stay inert. -->
  <link rel="stylesheet" href="home.css?v=20260903a">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f7fa;
      font-family: 'Inter', sans-serif; }

    /* Nav bar height + the device's bottom safe-area = the space reserved below
       the content host. The bar itself is fixed to the very bottom. */
    :root { --rm-navh: 56px; }
    .mobile-bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 200;
      box-sizing: content-box;
      padding-bottom: env(safe-area-inset-bottom);
      view-transition-name: rm-bottom-nav;
    }

    /* Persistent content host: fills everything ABOVE the nav bar. Tab iframes
       stack inside it; only the active one shows. */
    #rmHost {
      position: fixed; top: 0; left: 0; right: 0;
      bottom: calc(var(--rm-navh) + env(safe-area-inset-bottom));
      background: #f4f7fa; overflow: hidden;
      view-transition-name: rm-content;
    }
    .rm-frame { position: absolute; inset: 0; width: 100%; height: 100%;
      border: 0; background: #f4f7fa; display: none; }
    .rm-frame.rm-active { display: block; }
    #rmLoading { position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; color: #32cd32; font-size: 30px; z-index: 0; }
    #rmLoading.rm-hide { display: none; }

    /* SAME-document tab transition. The content host pans; the nav bar is a
       frozen group so it never moves, fades, or blinks. No document swap = no
       whole-app flash. */
    ::view-transition-group(rm-bottom-nav) { animation: none !important; }
    ::view-transition-old(rm-bottom-nav),
    ::view-transition-new(rm-bottom-nav) { animation: none !important; opacity: 1 !important; }
    ::view-transition-old(rm-content) { animation: rm-tab-out 240ms cubic-bezier(.4,0,.2,1) both; }
    ::view-transition-new(rm-content) { animation: rm-tab-in  240ms cubic-bezier(.4,0,.2,1) both; }
    @keyframes rm-tab-out { to   { transform: translateX(-16%); } }
    @keyframes rm-tab-in  { from { transform: translateX(16%);  } }
    @media (prefers-reduced-motion: reduce) {
      ::view-transition-old(rm-content), ::view-transition-new(rm-content) { animation: none; }
    }
  </style>
</head>
<body>

  <!-- TEMP DIAGNOSTIC (remove once the Portal whole-app-reload bug is solved):
       logs every app.html load to localStorage (survives the reloads) so we can
       SEE whether/when/how often the Capacitor web view is reloading. iOS exposes
       no memory API, so we capture what we can: navigation type + seconds since
       the previous app load. A reload within 20s = the jettison-reload signature.
       The on-screen panel only appears once that signature is detected, so normal
       users never see it. Tap the ⟳ badge to view/screenshot the log. -->
  <script>
  (function () {
    try {
      var KEY = 'rm_reload_log';
      var log = []; try { log = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) {}
      var navE = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || {};
      var now = Date.now();
      var prev = log.length ? log[log.length - 1].t : null;
      var entry = { t: now, nav: navE.type || '?', gap: prev != null ? Math.round((now - prev) / 1000) : null, vis: document.visibilityState };
      log.push(entry); if (log.length > 40) log = log.slice(-40);
      try { localStorage.setItem(KEY, JSON.stringify(log)); } catch (e) {}
      var rapid = log.filter(function (x, i) { return i > 0 && x.gap != null && x.gap < 20; }).length;
      function fmt(x) {
        var d = new Date(x.t), p = function (n) { return ('0' + n).slice(-2); };
        return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) +
               '  nav=' + x.nav + (x.gap != null ? ('  +' + x.gap + 's' + (x.gap < 20 ? ' ⚠' : '')) : '  (first)');
      }
      function show() {
        var p = document.getElementById('rmDiagPanel');
        if (!p) { p = document.createElement('div'); p.id = 'rmDiagPanel';
          p.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;z-index:2147483647;background:rgba(15,23,42,.97);color:#e2e8f0;font:11px/1.55 ui-monospace,monospace;padding:12px 14px;border-radius:12px;max-height:64vh;overflow:auto;box-shadow:0 8px 34px rgba(0,0,0,.45);';
          document.body.appendChild(p); }
        p.innerHTML = '<b>Reload log &mdash; ' + log.length + ' app loads (' + rapid + ' within 20s ⚠)</b><br><br>' +
          log.slice(-18).map(fmt).join('<br>') +
          '<br><br><span id="rmDiagClear" style="background:#ef4444;color:#fff;padding:5px 12px;border-radius:7px;">Clear</span>&nbsp;&nbsp;' +
          '<span id="rmDiagClose" style="background:#334155;color:#fff;padding:5px 12px;border-radius:7px;">Hide</span>';
        document.getElementById('rmDiagClear').onclick = function () { try { localStorage.removeItem(KEY); } catch (e) {} p.remove(); var b = document.getElementById('rmDiagBadge'); if (b) b.remove(); };
        document.getElementById('rmDiagClose').onclick = function () { p.remove(); };
      }
      function badge() {
        var b = document.getElementById('rmDiagBadge');
        if (!b) { b = document.createElement('div'); b.id = 'rmDiagBadge';
          b.style.cssText = 'position:fixed;right:6px;top:6px;z-index:2147483647;background:#ef4444;color:#fff;font:bold 11px/1 ui-monospace,monospace;padding:6px 9px;border-radius:13px;box-shadow:0 2px 10px rgba(0,0,0,.35);';
          b.onclick = show; document.body.appendChild(b); }
        b.textContent = '↻' + log.length;
      }
      // Surface the badge only once the reload signature appears (>=1 reload within
      // 20s), so a normal launch/relaunch never shows it. Log records silently.
      document.addEventListener('DOMContentLoaded', function () { if (rapid >= 1) badge(); });
    } catch (e) {}
  })();
  </script>
