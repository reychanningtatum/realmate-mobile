<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support — realmate</title>
<meta name="description" content="Contact realmate support. Send us a question, report a problem, or request help — we'll reply by email.">
<style>
  :root{ --grn:#22c55e; --grn-d:#16a34a; --ink:#0f172a; --sub:#64748b; --line:#e2e8f0; --bg:#f8fafc; --card:#ffffff; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; }
  .wrap{ max-width:640px; margin:0 auto; padding:32px 20px 60px; }
  .brand{ font-size:26px; font-weight:800; color:var(--grn); letter-spacing:-.5px; }
  h1{ font-size:24px; margin:22px 0 6px; }
  .lede{ color:var(--sub); font-size:15px; margin:0 0 24px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  label{ display:block; font-size:13px; font-weight:600; color:#334155; margin:14px 0 6px; }
  input,select,textarea{ width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 13px; font-size:15px; font-family:inherit; background:#fff; color:var(--ink); }
  input:focus,select:focus,textarea:focus{ outline:none; border-color:var(--grn); box-shadow:0 0 0 3px rgba(34,197,94,.15); }
  textarea{ min-height:120px; resize:vertical; }
  .btn{ margin-top:18px; width:100%; background:var(--grn); color:#fff; border:none; border-radius:10px; padding:13px; font-size:15px; font-weight:700; cursor:pointer; }
  .btn:hover{ background:var(--grn-d); }
  .btn:disabled{ opacity:.6; cursor:not-allowed; }
  .status{ margin-top:14px; font-size:14px; min-height:18px; }
  .status.ok{ color:var(--grn-d); font-weight:600; }
  .status.err{ color:#dc2626; }
  .foot{ margin-top:26px; font-size:13px; color:var(--sub); text-align:center; }
  .foot a{ color:var(--grn-d); text-decoration:none; font-weight:600; }
  @media (prefers-color-scheme:dark){
    :root{ --ink:#e2e8f0; --sub:#94a3b8; --line:#1e293b; --bg:#0b1220; --card:#0f172a; }
    input,select,textarea{ background:#0b1220; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">realmate<span style="color:var(--grn-d)">.</span></div>
    <h1>Support</h1>
    <p class="lede">Have a question, found a problem, or need help with your account? Send us a message and we'll reply to the email you provide.</p>
    <div class="card">
      <form id="supportForm" autocomplete="on">
        <label for="sName">Name</label>
        <input type="text" id="sName" name="name" placeholder="Your name" maxlength="120">

        <label for="sEmail">Email <span style="color:#dc2626">*</span></label>
        <input type="email" id="sEmail" name="email" placeholder="you@example.com" required maxlength="160">

        <label for="sCategory">Category</label>
        <select id="sCategory" name="category">
          <option value="general">General question</option>
          <option value="account">Account</option>
          <option value="bug">Report a problem / bug</option>
          <option value="billing">Billing</option>
          <option value="other">Other</option>
        </select>

        <label for="sSubject">Subject</label>
        <input type="text" id="sSubject" name="subject" placeholder="Brief summary" maxlength="160">

        <label for="sMessage">Message <span style="color:#dc2626">*</span></label>
        <textarea id="sMessage" name="message" placeholder="How can we help?" required maxlength="4000"></textarea>

        <button type="submit" class="btn" id="sSubmit">Send message</button>
        <div class="status" id="sStatus" role="status"></div>
      </form>
    </div>
    <p class="foot">
      <a href="index.html">Back to realmate</a> &nbsp;·&nbsp;
      <a href="privacy.html">Privacy Policy</a> &nbsp;·&nbsp;
      <a href="terms.html">Terms of Use</a>
    </p>
  </div>

  <script src="vendor/supabase-js.min.js?v=2.112.3"></script>
  <script>
    (function () {
      var SB_URL = 'https://wmegpgrfrtprhuzmgjma.supabase.co';
      var SB_KEY = 'sb_publishable_Rm_fIBDUfu3DEyLj0_bWZw_qEqo8cd4';
      var sb = window.supabase ? window.supabase.createClient(SB_URL, SB_KEY) : null;
      var form = document.getElementById('supportForm');
      var btn = document.getElementById('sSubmit');
      var status = document.getElementById('sStatus');

      // Prefill from a signed-in session / localStorage if available (optional).
      try {
        var u = JSON.parse(localStorage.getItem('user') || '{}');
        if (u && u.name) document.getElementById('sName').value = u.name;
        if (u && u.email) document.getElementById('sEmail').value = u.email;
      } catch (e) {}

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        if (!sb) { status.className = 'status err'; status.textContent = 'Could not reach the server. Please try again later.'; return; }
        var email = document.getElementById('sEmail').value.trim();
        var message = document.getElementById('sMessage').value.trim();
        if (!email || !message) { status.className = 'status err'; status.textContent = 'Please enter your email and a message.'; return; }
        btn.disabled = true; status.className = 'status'; status.textContent = 'Sending…';
        var uid = null;
        try { var r = await sb.auth.getUser(); uid = r && r.data && r.data.user ? r.data.user.id : null; } catch (e) {}
        try {
          var payload = {
            name: document.getElementById('sName').value.trim() || null,
            email: email,
            category: document.getElementById('sCategory').value,
            subject: document.getElementById('sSubject').value.trim() || null,
            message: message,
            user_id: uid
          };
          var res = await sb.from('support_requests').insert(payload);
          if (res.error) throw res.error;
          form.reset();
          status.className = 'status ok';
          status.textContent = 'Thanks! Your message has been received — we’ll reply to ' + email + '.';
        } catch (err) {
          console.error('[Support] submit failed', err);
          status.className = 'status err';
          status.textContent = 'Sorry, something went wrong. Please try again.';
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
