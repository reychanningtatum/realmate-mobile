<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>realmate video</title>
<!-- Home video player (DRAFT Home dashboard). Served from the website so YouTube
     always sees a normal https page — inside the iOS app, Home itself runs on the
     app's internal address, which YouTube refuses to play from (Error 153).

     YouTube API policy (Required Minimum Functionality / Developer Policies):
     - the official embedded player only, unmodified, NOTHING drawn over it;
     - automatic playback only while more than half of the player is visible —
       Home (the parent) watches that and sends {rmVideo:'play'|'pause'};
     - no background playback — Home sends 'pause' when it is hidden;
     - muted autoplay by default; Settings > "Auto-mute Home video" off starts it
       with sound (falls back to muted where a browser blocks sound).
     ?v=<11-char YouTube id>. Loops at the end. -->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #p, #p iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<div id="p"></div>
<script>
(function () {
  'use strict';
  var id = new URLSearchParams(location.search).get('v') || '';
  if (!/^[A-Za-z0-9_-]{11}$/.test(id)) return;          // YouTube video ids only
  var player = null, ready = false, want = 'pause';
  var sound = false;        // Settings > "Auto-mute Home video" off -> start with sound
  var applied = null;       // what we last set: true = sound on
  var userSound = null;     // the viewer's own choice (YouTube's speaker button) this visit

  function playMuted() { if (!player) return; player.mute(); applied = false; player.playVideo(); }

  function apply() {
    if (!ready) return;
    if (want === 'play') {
      var on = userSound !== null ? userSound : sound;
      if (on) { player.unMute(); player.setVolume(100); } else player.mute();
      applied = on;
      player.playVideo();
      watchdog(5, ++wdRun);
    } else {
      // Remember a sound change the viewer made with YouTube's own control.
      var nowOn = !player.isMuted();
      if (applied !== null && nowOn !== applied) userSound = nowOn;
      player.pauseVideo();
    }
  }

  // Until it is really playing, check every 2s (up to `tries` times):
  //  - a browser that blocked autoplay WITH sound -> play muted instead;
  //  - iPhones can ignore a play request while the player is still loading -> ask again;
  //  - still loading (BUFFERING) on a slow connection is not a failure -> wait.
  var wdRun = 0;            // only the newest check loop runs
  function watchdog(tries, run) {
    setTimeout(function () {
      if (want !== 'play' || run !== wdRun) return;
      var st = player.getPlayerState();
      if (st === YT.PlayerState.PLAYING) return;
      if (st !== YT.PlayerState.BUFFERING) {
        if (!player.isMuted()) playMuted(); else player.playVideo();
      }
      if (tries > 1) watchdog(tries - 1, run);
    }, 2000);
  }

  function tell(msg) { try { window.parent.postMessage(msg, '*'); } catch (e) {} }

  // Only the page that embeds this player (Home) may start or pause it.
  window.addEventListener('message', function (e) {
    if (e.source !== window.parent || !e.data || typeof e.data !== 'object') return;
    if (e.data.rmVideo !== 'play' && e.data.rmVideo !== 'pause') return;
    var s = !!e.data.sound;
    if (s !== sound) { sound = s; userSound = null; }   // the setting changed -> it wins again
    want = e.data.rmVideo;
    apply();
  });

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('p', {
      videoId: id,
      host: 'https://www.youtube-nocookie.com',
      playerVars: { autoplay: 0, mute: 1, playsinline: 1, rel: 0, controls: 1, loop: 1, playlist: id },
      events: {
        onReady: function () {
          ready = true;
          apply();
          tell({ rmVideo: 'ready', state: player.getPlayerState(), muted: player.isMuted() });
        },
        // YouTube reports a blocked autoplay (with sound) here.
        onAutoplayBlocked: function () { if (want === 'play') playMuted(); },
        onStateChange: function (e) {
          if (e.data === YT.PlayerState.ENDED && want === 'play') { player.seekTo(0, true); player.playVideo(); }  // loop
          tell({ rmVideo: 'state', state: e.data, muted: player.isMuted() });   // Home reports a failed autoplay
        }
      }
    });
  };
  var s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
})();
</script>
</body>
</html>
