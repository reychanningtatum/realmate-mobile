<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>realmate video</title>
<!-- Home video player (DRAFT Home dashboard). Served from the website so YouTube
     always sees a normal https page — inside the iOS app, Home itself runs on the
     app's internal address, which YouTube refuses to play from (Error 153).

     YouTube API policy (Required Minimum Functionality / Developer Policies):
     - the official embedded player only, unmodified, NOTHING drawn over it;
     - automatic playback only while more than half of the player is visible —
       Home (the parent) creates this player with ?ap=1 only then, and sends
       {rmVideo:'pause'|'play'} as it leaves / returns to the screen;
     - no background playback — Home sends 'pause' when it is hidden;
     - sound by default in the app, muted by default on the website (Settings >
       "Auto-mute Home video"); where a browser blocks sound it falls back to muted.
     ?v=<11-char YouTube id>. Loops at the end. -->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #p, #p iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<div id="p"></div>
<script>
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var id = q.get('v') || '';
  if (!/^[A-Za-z0-9_-]{11}$/.test(id)) return;          // YouTube video ids only
  // Set by Home when it creates this player: ap=1 autoplay now (Home only does that
  // while the player is on screen), m=1 start muted, t=start second (a resume).
  // iPhones only autoplay when it is asked for at creation — a later play() from
  // code is ignored without a tap — so Home recreates the player to resume.
  var ap = q.get('ap') === '1', mute = q.get('m') !== '0';
  var start = Math.max(0, parseInt(q.get('t') || '0', 10) || 0);
  var player = null, want = ap ? 'play' : 'pause';

  function tell(msg) { try { window.parent.postMessage(msg, '*'); } catch (e) {} }
  function now() { try { return Math.floor(player.getCurrentTime() || 0); } catch (e) { return 0; } }

  // A requested play that hasn't started after a while → tell Home (it recreates the
  // player with autoplay, muted if sound was refused). Loading is not a failure.
  var wdRun = 0;            // only the newest check runs
  function watchdog(tries, run) {
    setTimeout(function () {
      if (want !== 'play' || run !== wdRun || !player) return;
      var st = player.getPlayerState();
      if (st === YT.PlayerState.PLAYING) return;
      if (st === YT.PlayerState.BUFFERING && tries > 1) return watchdog(tries - 1, run);
      tell({ rmVideo: 'blocked', muted: player.isMuted(), time: now() });
    }, 2500);
  }

  // Only the page that embeds this player (Home) may start or pause it.
  window.addEventListener('message', function (e) {
    if (e.source !== window.parent || !e.data || typeof e.data !== 'object' || !player || !player.pauseVideo) return;
    if (e.data.rmVideo === 'pause') { want = 'pause'; player.pauseVideo(); }
    if (e.data.rmVideo === 'play') { want = 'play'; player.playVideo(); watchdog(3, ++wdRun); }
  });

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('p', {
      videoId: id,
      host: 'https://www.youtube-nocookie.com',
      playerVars: { autoplay: ap ? 1 : 0, mute: mute ? 1 : 0, start: start, playsinline: 1, rel: 0, controls: 1, loop: 1, playlist: id },
      events: {
        onReady: function () {
          tell({ rmVideo: 'ready', state: player.getPlayerState(), muted: player.isMuted(), time: now() });
          if (want === 'play') { player.playVideo(); watchdog(3, ++wdRun); }
        },
        // YouTube reports a blocked autoplay here.
        onAutoplayBlocked: function () { if (want === 'play') tell({ rmVideo: 'blocked', muted: player.isMuted(), time: now() }); },
        onStateChange: function (e) {
          if (e.data === YT.PlayerState.ENDED && want === 'play') { player.seekTo(0, true); player.playVideo(); }  // loop
          tell({ rmVideo: 'state', state: e.data, muted: player.isMuted(), time: now() });
        }
      }
    });
  };
  var s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
})();
</script>
</body>
</html>
