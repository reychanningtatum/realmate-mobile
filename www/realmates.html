  <script src="toast.js?v=20260819a"></script>
  <style>
    .rm-page { max-width: 760px; margin: 0 auto; padding: 28px 20px 60px; }
    /* Bug 2: align mobile spacing with the Feed (main-content adds the 80px bottom) */
    @media (max-width: 768px) { .rm-page { padding: 14px 12px 24px; } }
    .rm-page-title { font-size: 22px; font-weight: 800; color: var(--text-main); margin-bottom: 4px; }
    .rm-page-sub { font-size: 13px; color: var(--text-sub); margin-bottom: 28px; }

    /* Section headers */
    .rm-section-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1.2px; color: #94a3b8; margin: 0 0 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .rm-section-label i { font-size: 13px; }
    .rm-section { margin-bottom: 32px; }

    /* Mate card */
    .rm-card {
      display: flex; align-items: center; gap: 14px;
      background: #fff; border: 1px solid #e2e8f0; border-radius: 14px;
      padding: 14px 16px; margin-bottom: 10px;
      transition: box-shadow 0.15s, transform 0.15s;
    }
    .rm-card:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.07); transform: translateY(-1px); }
    .rm-card-clickable { cursor: pointer; }
    .rm-card-avatar {
      width: 46px; height: 46px; border-radius: 12px;
      object-fit: cover; flex-shrink: 0; background: #f1f5f9;
    }
    .rm-card-info { flex: 1; min-width: 0; }
    .rm-card-name { font-size: 14px; font-weight: 700; color: var(--text-main); }
    .rm-card-job { font-size: 12px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rm-card-badge {
      font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 50px;
      white-space: nowrap; flex-shrink: 0;
    }
    .rm-badge-mates { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
    .rm-badge-removable:hover { background: #fef2f2; color: #ef4444; border-color: #fca5a5; }
    .rm-badge-removable:hover i::before { content: "\f235"; } /* user-times */
    .rm-badge-pending { background: #fefce8; color: #ca8a04; border: 1px solid #fde68a; }
    .rm-badge-sent { background: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; }

    /* Action buttons on pending received cards */
    .rm-card-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .rm-btn-accept {
      font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 50px;
      border: 1.5px solid #32cd32; background: #f0fdf4; color: #16a34a;
      cursor: pointer; transition: all 0.15s; font-family: inherit;
    }
    .rm-btn-accept:hover { background: #32cd32; color: #fff; }
    .rm-btn-decline {
      font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 50px;
      border: 1.5px solid #e2e8f0; background: #f8fafc; color: #94a3b8;
      cursor: pointer; transition: all 0.15s; font-family: inherit;
    }
    .rm-btn-decline:hover { background: #fef2f2; border-color: #fca5a5; color: #ef4444; }

    /* Empty state */
    .rm-empty {
      text-align: center; padding: 36px 20px;
      color: var(--text-sub); font-size: 13px;
    }
    .rm-empty i { font-size: 32px; color: #cbd5e1; display: block; margin-bottom: 10px; }
    .rm-empty strong { display: block; font-size: 15px; font-weight: 700; color: var(--text-main); margin-bottom: 6px; }

    /* Loading */
    .rm-loading { text-align: center; padding: 48px 20px; color: #94a3b8; }
    .rm-loading i { font-size: 24px; }

    /* Stats bar — doubles as tab controls (see setRmTab()) */
    .rm-stats {
      display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 28px;
    }
    .rm-stat {
      flex: 1; min-width: 120px; background: #fff; border: 1.5px solid #e2e8f0;
      border-radius: 14px; padding: 16px 18px;
      cursor: pointer; text-align: left; font-family: inherit;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }
    .rm-stat:hover { border-color: #cbd5e1; box-shadow: 0 4px 14px rgba(0,0,0,0.07); transform: translateY(-1px); }
    .rm-stat-num { font-size: 26px; font-weight: 800; color: var(--text-main); line-height: 1; }
    .rm-stat-label { font-size: 11px; color: var(--text-sub); margin-top: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
    .rm-stat[data-tab="accepted"].rm-stat-active { background: #f0fdf4; border-color: #32cd32; }
    .rm-stat[data-tab="pending"].rm-stat-active { background: #fffbeb; border-color: #f59e0b; }
    .rm-stat[data-tab="sent"].rm-stat-active { background: #eff6ff; border-color: #3b82f6; }

    html[data-theme="dark"] .rm-card { background: #1e293b; border-color: #334155; }
    html[data-theme="dark"] .rm-card:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.25); }
    html[data-theme="dark"] .rm-stat { background: #1e293b; border-color: #334155; }
    html[data-theme="dark"] .rm-stat[data-tab="accepted"].rm-stat-active { background: rgba(50,205,50,0.1); border-color: #32cd32; }
    html[data-theme="dark"] .rm-stat[data-tab="pending"].rm-stat-active { background: rgba(245,158,11,0.1); border-color: #f59e0b; }
    html[data-theme="dark"] .rm-stat[data-tab="sent"].rm-stat-active { background: rgba(59,130,246,0.1); border-color: #3b82f6; }
    html[data-theme="dark"] .rm-badge-mates { background: rgba(50,205,50,0.1); border-color: rgba(50,205,50,0.25); }
    html[data-theme="dark"] .rm-badge-removable:hover { background: rgba(239,68,68,0.12); color: #f87171; border-color: rgba(239,68,68,0.35); }
    html[data-theme="dark"] .rm-badge-pending { background: rgba(234,179,8,0.1); border-color: rgba(234,179,8,0.25); }
    html[data-theme="dark"] .rm-badge-sent { background: #0f172a; border-color: #334155; }
    html[data-theme="dark"] .rm-btn-accept { background: rgba(50,205,50,0.12); }
    html[data-theme="dark"] .rm-btn-decline { background: #0f172a; border-color: #334155; }
  </style>

<script>
function avatarFallback(name) {
  return `https://ui-avatars.com/api/?name=${encodeURIComponent(name || '?')}&background=random&color=fff`;
}

function goToProfile(userId) {
  if (userId) location.href = `dashboard.html?user_id=${userId}`;
}

let _rmActiveTab = 'accepted';

function setRmTab(tab) {
  _rmActiveTab = tab;
  document.querySelectorAll('.rm-tab-panel').forEach(panel => {
    panel.style.display = panel.getAttribute('data-tab-panel') === tab ? 'block' : 'none';
  });
  document.querySelectorAll('.rm-stat').forEach(btn => {
    btn.classList.toggle('rm-stat-active', btn.getAttribute('data-tab') === tab);
  });
}

async function loadRealmates() {
  const { accepted, pendingReceived, pendingSent } = await getMatesList();

  document.getElementById('rmLoading').style.display = 'none';
  document.getElementById('rmContent').style.display = 'block';

  // Stats — doubles as the tab controls, see setRmTab()
  document.getElementById('rmStats').innerHTML = `
    <button type="button" class="rm-stat" data-tab="accepted" onclick="setRmTab('accepted')">
      <div class="rm-stat-num">${accepted.length}</div>
      <div class="rm-stat-label"><i class="fas fa-user-group" style="color:#32cd32;margin-right:4px;"></i>Realmates</div>
    </button>
    <button type="button" class="rm-stat" data-tab="pending" onclick="setRmTab('pending')">
      <div class="rm-stat-num">${pendingReceived.length}</div>
      <div class="rm-stat-label"><i class="fas fa-user-clock" style="color:#f59e0b;margin-right:4px;"></i>Requests In</div>
    </button>
    <button type="button" class="rm-stat" data-tab="sent" onclick="setRmTab('sent')">
      <div class="rm-stat-num">${pendingSent.length}</div>
      <div class="rm-stat-label"><i class="fas fa-paper-plane" style="color:#64748b;margin-right:4px;"></i>Requests Out</div>
    </button>
  `;

  // Accepted
  const acceptedList = document.getElementById('rmAcceptedList');
  if (accepted.length === 0) {
    acceptedList.innerHTML = `
      <div class="rm-empty">
        <i class="fas fa-user-group"></i>
        <strong>No Realmates yet</strong>
        Browse the Live Market and connect with fellow agents.
      </div>`;
  } else {
    acceptedList.innerHTML = accepted.map(m => `
      <div class="rm-card${m.id ? ' rm-card-clickable' : ''}" ${m.id ? `onclick="goToProfile('${m.id}')"` : ''}>
        <img class="rm-card-avatar" src="${m.img || avatarFallback(m.name)}" onerror="this.src='${avatarFallback(m.name)}'">
        <div class="rm-card-info">
          <div class="rm-card-name">${m.name}</div>
          <div class="rm-card-job">Realmate</div>
        </div>
        <span class="rm-card-badge rm-badge-mates rm-badge-removable" style="cursor:pointer;" title="Remove Realmate" onclick="event.stopPropagation(); removeFromPage('${m.name.replace(/'/g, "\\'")}')"><i class="fas fa-user-group" style="margin-right:4px;"></i>Realmates</span>
      </div>
    `).join('');
  }

  // Pending received (Requests In)
  const pendingList = document.getElementById('rmPendingList');
  if (pendingReceived.length === 0) {
    pendingList.innerHTML = `
      <div class="rm-empty">
        <i class="fas fa-user-clock"></i>
        <strong>No incoming requests</strong>
        You're all caught up.
      </div>`;
  } else {
    pendingList.innerHTML = pendingReceived.map(m => `
      <div class="rm-card${m.id ? ' rm-card-clickable' : ''}" ${m.id ? `onclick="goToProfile('${m.id}')"` : ''}>
        <img class="rm-card-avatar" src="${m.img || avatarFallback(m.name)}" onerror="this.src='${avatarFallback(m.name)}'">
        <div class="rm-card-info">
          <div class="rm-card-name">${m.name}</div>
          <div class="rm-card-job">Sent you a Realmate request</div>
        </div>
        <div class="rm-card-actions" onclick="event.stopPropagation();">
          <button type="button" class="rm-btn-accept" onclick="acceptFromPage('${m.name.replace(/'/g, "\\'")}')">Accept</button>
          <button type="button" class="rm-btn-decline" onclick="declineFromPage('${m.name.replace(/'/g, "\\'")}')">Decline</button>
        </div>
      </div>
    `).join('');
  }

  // Pending sent (Requests Out)
  const sentList = document.getElementById('rmSentList');
  if (pendingSent.length === 0) {
    sentList.innerHTML = `
      <div class="rm-empty">
        <i class="fas fa-paper-plane"></i>
        <strong>No outgoing requests</strong>
        Requests you send will show up here.
      </div>`;
  } else {
    sentList.innerHTML = pendingSent.map(m => `
      <div class="rm-card${m.id ? ' rm-card-clickable' : ''}" ${m.id ? `onclick="goToProfile('${m.id}')"` : ''}>
        <div style="width:46px;height:46px;border-radius:12px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <i class="fas fa-user" style="color:#cbd5e1;font-size:20px;"></i>
        </div>
        <div class="rm-card-info">
          <div class="rm-card-name">${m.name}</div>
          <div class="rm-card-job">Pending response</div>
        </div>
        <span class="rm-card-badge rm-badge-sent"><i class="fas fa-clock" style="margin-right:4px;"></i>Pending</span>
      </div>
    `).join('');
  }

  setRmTab(_rmActiveTab);
}

async function acceptFromPage(requesterName) {
  const result = await acceptMateRequest(requesterName);
  if (result && result.success) {
    loadRealmates();
  } else {
    (window.showToast || alert)('Could not accept: ' + ((result && result.error) || 'Unknown error'), 'error');
  }
}

async function declineFromPage(requesterName) {
  const result = await declineMateRequest(requesterName);
  if (result && result.success) {
    loadRealmates();
  } else {
    (window.showToast || alert)('Could not decline: ' + ((result && result.error) || 'Unknown error'), 'error');
  }
}

async function removeFromPage(mateName) {
  const ok = await showConfirmDialog({
    title: 'Remove Realmate?',
    message: `Are you sure you want to remove ${mateName} from your Realmates? You'll need to send a new request to reconnect.`,
    confirmText: 'Remove',
    cancelText: 'Cancel'
  });
  if (!ok) return;
  const result = await removeMate(mateName);
  if (result && result.success) {
    loadRealmates();
  } else {
    (window.showToast || alert)('Could not remove: ' + ((result && result.error) || 'Unknown error'), 'error');
  }
}

document.addEventListener('DOMContentLoaded', loadRealmates);
</script>
