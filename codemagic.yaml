# Codemagic CI config — Realmate Mobile
# Purpose: produce a DEBUG Android APK entirely in the cloud (free tier).
# Free tier = 500 build minutes/month on macOS M2 ONLY (Linux/Windows are NOT
# free), so this workflow pins instance_type: mac_mini_m2 to stay at $0.
# No signing credentials, no Google Play, no production build.
workflows:
  android-debug:
    name: Realmate Android Debug (free-tier)
    instance_type: mac_mini_m2      # only instance with free minutes
    max_build_duration: 30          # safety cap; a debug build takes ~5-10 min
    environment:
      node: 20                      # Capacitor 7 needs Node 20+
    # No 'triggering:' block => builds start MANUALLY from the dashboard,
    # so no minutes are consumed until you click "Start new build".
    scripts:
      - name: Install JS dependencies (reproducible)
        # Retry: `sharp` downloads a prebuilt libvips binary from GitHub during
        # install and that fetch intermittently times out on CI, failing the
        # whole build. Retry npm ci a few times before giving up.
        script: |
          for i in 1 2 3 4; do
            npm ci && break
            echo "npm ci failed (attempt $i) — retrying in 15s…"; sleep 15
          done
      - name: Capacitor sync — regenerate android web assets FROM www/
        # This repopulates android/app/src/main/assets/public from www/.
        # We never hand-maintain those generated files (they are gitignored).
        script: npx cap sync android
      - name: Build DEBUG APK (auto-signed with Android debug keystore)
        script: |
          cd android
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - android/app/build/outputs/**/*.apk   # -> app-debug.apk

  ios-debug:
    name: Realmate iOS Debug (unsigned simulator, free-tier)
    instance_type: mac_mini_m2      # only instance with free minutes; has Xcode + CocoaPods
    max_build_duration: 45          # iOS cold build (pod install + xcodebuild) is slower
    environment:
      node: 20
      xcode: 26.4                 # unsigned simulator build; no signing, no Apple account
    # No 'triggering:' block => manual start only (no minutes until you click build).
    scripts:
      - name: Install JS dependencies (reproducible)
        # Retry: `sharp` downloads a prebuilt libvips binary from GitHub during
        # install and that fetch intermittently times out on CI, failing the
        # whole build. Retry npm ci a few times before giving up.
        script: |
          for i in 1 2 3 4; do
            npm ci && break
            echo "npm ci failed (attempt $i) — retrying in 15s…"; sleep 15
          done
      - name: Generate iOS project in the cloud (Capacitor uses CI's CocoaPods)
        # ios/ is NOT committed; it is generated here where CocoaPods + Xcode exist.
        script: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios
      - name: Build UNSIGNED iOS simulator app (no code signing, no Apple account)
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Zip the .app bundle for artifact download
        script: |
          cd ios/build/Build/Products/Debug-iphonesimulator
          zip -r -y Realmate-simulator-app.zip App.app
    artifacts:
      - ios/build/Build/Products/Debug-iphonesimulator/*.zip

  # ---------------------------------------------------------------------------
  # ios-release: signed real-device build -> App Store Connect / TestFlight.
  # This is a NEW, separate workflow. It does not change ios-debug (which stays
  # an unsigned iphonesimulator build) or android-debug. Automatic App Store
  # distribution signing is handled by Codemagic via the "Apple Developer Portal"
  # integration named "Codemagic Realmate" — no certificates, provisioning
  # profiles, API keys, or .p8 files are ever committed to this repo.
  ios-release:
    name: Realmate iOS Release (signed device build -> TestFlight)
    instance_type: mac_mini_m2      # M2 has Xcode + CocoaPods (same as ios-debug)
    max_build_duration: 60          # signing + archive + TestFlight upload is slower
    integrations:
      app_store_connect: Codemagic Realmate   # integration configured in the Codemagic UI
    environment:
      node: 20                      # Capacitor 7 needs Node 20+
      xcode: 26.4                   # pinned, NOT "latest"
      ios_signing:
        distribution_type: app_store          # automatic App Store / TestFlight signing
        bundle_identifier: com.realmate.app   # signs this bundle id
      vars:
        BUNDLE_ID: "com.realmate.app"
        APPLE_TEAM_ID: "RYT2TFV64G"           # team behind the "Codemagic Realmate" integration
        APP_STORE_APPLE_ID: 6802656686        # numeric App Store Connect app id (build-number lookup)
    # Auto-build: every push to master rebuilds and uploads to TestFlight, so the
    # app tracks the code with no manual "Start build" click. Uses free-tier
    # minutes per push (~3 min each); master is only pushed on deliberate releases.
    # (Requires Codemagic's GitHub webhook, which is set up when the app is added.)
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true
    scripts:
      - name: Install JS dependencies (reproducible)
        # Retry: `sharp` downloads a prebuilt libvips binary from GitHub during
        # install and that fetch intermittently times out on CI, failing the
        # whole build. Retry npm ci a few times before giving up.
        script: |
          for i in 1 2 3 4; do
            npm ci && break
            echo "npm ci failed (attempt $i) — retrying in 15s…"; sleep 15
          done
      - name: Generate iOS project in the cloud (Capacitor uses CI's CocoaPods)
        # ios/ is NOT committed; it is generated here where CocoaPods + Xcode exist.
        script: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios
      - name: Ensure AppDelegate forwards APNs device-token callbacks to Capacitor
        # The @capacitor/push-notifications plugin only receives the device token if
        # the app's AppDelegate forwards UIKit's didRegister/didFail callbacks to
        # Capacitor via NotificationCenter. ios/ is regenerated every build, so we
        # verify/inject this here (idempotent: only adds the methods if absent).
        # Without this, PushNotifications 'registration' never fires and no token is
        # ever stored — exactly the "device_tokens empty" symptom.
        script: |
          AD=ios/App/App/AppDelegate.swift
          if [ ! -f "$AD" ]; then echo "AppDelegate.swift not found at $AD"; exit 1; fi
          echo "----- AppDelegate.swift (before) -----"; cat "$AD"
          if grep -q "capacitorDidRegisterForRemoteNotifications" "$AD"; then
            echo "AppDelegate already forwards APNs registration — no change."
          else
            echo "Injecting APNs forwarding methods into AppDelegate.swift"
            perl -0777 -pi -e 's/\}\s*\z/\n    func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {\n        NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)\n    }\n\n    func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {\n        NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)\n    }\n}\n/' "$AD"
          fi
          # Clear the home-screen APP-ICON BADGE whenever the app becomes active.
          # Pushes set aps.badge = the unread count; iOS never resets it on its own,
          # so after the user reads their notifications the red icon badge lingers
          # ("badge shows but nothing inside"). Inject a reset into the AppDelegate's
          # existing applicationDidBecomeActive. Idempotent.
          if grep -q "applicationIconBadgeNumber = 0" "$AD"; then
            echo "AppDelegate already clears the icon badge — no change."
          else
            echo "Injecting icon-badge reset into applicationDidBecomeActive"
            perl -0777 -pi -e 's/(func applicationDidBecomeActive\(_ application: UIApplication\) \{)/$1\n        application.applicationIconBadgeNumber = 0/' "$AD"
          fi
          echo "----- AppDelegate.swift (after) -----"; cat "$AD"
      - name: Generate app icon + splash from assets/ (into the CI-generated ios project)
        # @capacitor/assets writes AppIcon + splash into ios/App/App/Assets.xcassets.
        # Runs AFTER 'npx cap add ios' (the project must exist) and before build.
        script: npx capacitor-assets generate --ios
      - name: Set required Info.plist keys (export compliance + camera/photo usage)
        # ios/App/App/Info.plist is generated (not committed). Set export compliance
        # to avoid the "Missing Compliance" TestFlight hold, AND the camera/photo
        # usage strings the registration (Alveo ID) + composer photo pickers need:
        # a web <input type=file> invokes the native picker, and without these keys
        # iOS hard-crashes on the first photo tap and App Review rejects the build.
        script: |
          PLIST=ios/App/App/Info.plist
          plist_set() {
            /usr/libexec/PlistBuddy -c "Add :$1 $2 $3" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Set :$1 $3" "$PLIST"
          }
          plist_set ITSAppUsesNonExemptEncryption bool false
          plist_set NSCameraUsageDescription string "Realmate uses the camera so you can take and upload photos of your property listings and verification documents."
          plist_set NSPhotoLibraryUsageDescription string "Realmate accesses your photos so you can attach listing images and upload your Alveo ID for account verification."
          # Face ID / Touch ID sign-in (capacitor-native-biometric). Without this
          # key iOS hard-crashes the first time BiometricAuth is invoked.
          plist_set NSFaceIDUsageDescription string "Realmate uses Face ID so you can sign in quickly and securely without re-entering your password."
          # Register the realmate:// custom URL scheme so the welcome-email deep link
          # (enter.html tries realmate://open) opens THIS app. A URL scheme needs no
          # entitlement or provisioning-profile capability — unlike Universal Links —
          # so it can't break code-signing. Info.plist is regenerated each build, so
          # these Add commands always start from a clean plist.
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.realmate.app" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string realmate" "$PLIST" 2>/dev/null || true
          echo "----- Info.plist CFBundleURLTypes -----"; /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST" || true
      - name: Restrict binary to iPhone only (TARGETED_DEVICE_FAMILY = 1)
        # Capacitor's generated Xcode project defaults to universal (iPhone + iPad = "1,2").
        # Realmate is a phone-first app with no iPad-specific design, so limit the binary
        # to iPhone. This removes the App Store requirement to upload iPad screenshots.
        script: |
          PBXPROJ=ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2"/TARGETED_DEVICE_FAMILY = "1"/g' "$PBXPROJ"
          sed -i '' 's/TARGETED_DEVICE_FAMILY = 1,2;/TARGETED_DEVICE_FAMILY = 1;/g' "$PBXPROJ"
          echo "TARGETED_DEVICE_FAMILY after patch:"
          grep -n "TARGETED_DEVICE_FAMILY" "$PBXPROJ" || true
      - name: Enable Push Notifications capability (aps-environment entitlement)
        # Push config, like Info.plist above, is injected at build time because ios/
        # is regenerated each build (never hand-committed). Writes the App.entitlements
        # file with the APNs entitlement and points the App target's build configs at
        # it. REQUIRES the App ID (com.realmate.app) to have "Push Notifications"
        # enabled in the Apple Developer portal, so the profile fetched by the next
        # step includes the `aps` capability — otherwise code-signing will fail.
        # 'production' is the correct aps-environment for App Store / TestFlight builds.
        # NOTE: the welcome-email "Enter Realmate" deep link opens the app via a custom
        # URL scheme (realmate://, registered in Info.plist above), NOT Universal Links —
        # so NO associated-domains entitlement is needed here (which keeps signing simple
        # and avoids the App-ID-capability/provisioning-profile dance).
        script: |
          ENT=ios/App/App/App.entitlements
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            echo '<plist version="1.0">'
            echo '<dict>'
            echo '  <key>aps-environment</key>'
            echo '  <string>production</string>'
            echo '</dict>'
            echo '</plist>'
          } > "$ENT"
          # Point the App target at the entitlements file. The 'xcodeproj' gem ships
          # with CocoaPods (already installed on the CI image); install defensively.
          gem list -i xcodeproj >/dev/null 2>&1 || sudo gem install xcodeproj --no-document
          ruby -e "require 'xcodeproj'; p=Xcodeproj::Project.open('ios/App/App.xcodeproj'); t=p.targets.find{|x| x.name=='App'}; raise 'App target not found' unless t; t.build_configurations.each{|c| c.build_settings['CODE_SIGN_ENTITLEMENTS']='App/App.entitlements'}; p.save; puts 'CODE_SIGN_ENTITLEMENTS set for App target'"
          echo "Entitlements written:"; cat "$ENT"
      - name: Apply App Store signing profiles fetched via the integration
        # Pulls/creates the distribution cert + provisioning profile (team RYT2TFV64G)
        # using the App Store Connect API key, then writes them into the Xcode project.
        script: xcode-project use-profiles
      - name: Set a unique, incrementing build number (based on latest TestFlight build)
        script: |
          cd ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)
          if [ -z "$LATEST_BUILD_NUMBER" ]; then LATEST_BUILD_NUMBER=0; fi
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Build signed IPA (Release configuration, device / iphoneos)
        # build-ipa archives for a real device (iphoneos, NOT iphonesimulator)
        # and exports a signed .ipa using the applied App Store profile.
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App \
            --config Release
    artifacts:
      - build/ios/ipa/*.ipa                   # the signed .ipa
      - /tmp/xcodebuild_logs/*.log            # build logs (for debugging failures)
    publishing:
      app_store_connect:
        auth: integration           # authenticate with the "Codemagic Realmate" API key
        submit_to_testflight: true  # upload the .ipa and release it to TestFlight
