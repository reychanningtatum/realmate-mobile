# Codemagic CI config — Realmate Mobile
# Purpose: produce a DEBUG Android APK entirely in the cloud (free tier).
# Free tier = 500 build minutes/month on macOS M2 ONLY (Linux/Windows are NOT
# free), so this workflow pins instance_type: mac_mini_m2 to stay at $0.
# No signing credentials, no Google Play, no production build.
workflows:
  android-debug:
    name: Realmate Android Debug (free-tier)
    instance_type: mac_mini_m2      # only instance with free minutes
    max_build_duration: 30          # safety cap; a debug build takes ~5-10 min
    environment:
      node: 20                      # Capacitor 7 needs Node 20+
    # No 'triggering:' block => builds start MANUALLY from the dashboard,
    # so no minutes are consumed until you click "Start new build".
    scripts:
      - name: Install JS dependencies (reproducible)
        script: npm ci
      - name: Capacitor sync — regenerate android web assets FROM www/
        # This repopulates android/app/src/main/assets/public from www/.
        # We never hand-maintain those generated files (they are gitignored).
        script: npx cap sync android
      - name: Build DEBUG APK (auto-signed with Android debug keystore)
        script: |
          cd android
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - android/app/build/outputs/**/*.apk   # -> app-debug.apk

  ios-debug:
    name: Realmate iOS Debug (unsigned simulator, free-tier)
    instance_type: mac_mini_m2      # only instance with free minutes; has Xcode + CocoaPods
    max_build_duration: 45          # iOS cold build (pod install + xcodebuild) is slower
    environment:
      node: 20
      xcode: 26.4                 # unsigned simulator build; no signing, no Apple account
    # No 'triggering:' block => manual start only (no minutes until you click build).
    scripts:
      - name: Install JS dependencies (reproducible)
        script: npm ci
      - name: Generate iOS project in the cloud (Capacitor uses CI's CocoaPods)
        # ios/ is NOT committed; it is generated here where CocoaPods + Xcode exist.
        script: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios
      - name: Build UNSIGNED iOS simulator app (no code signing, no Apple account)
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Zip the .app bundle for artifact download
        script: |
          cd ios/build/Build/Products/Debug-iphonesimulator
          zip -r -y Realmate-simulator-app.zip App.app
    artifacts:
      - ios/build/Build/Products/Debug-iphonesimulator/*.zip

  # ---------------------------------------------------------------------------
  # ios-release: signed real-device build -> App Store Connect / TestFlight.
  # This is a NEW, separate workflow. It does not change ios-debug (which stays
  # an unsigned iphonesimulator build) or android-debug. Automatic App Store
  # distribution signing is handled by Codemagic via the "Apple Developer Portal"
  # integration named "Codemagic Realmate" — no certificates, provisioning
  # profiles, API keys, or .p8 files are ever committed to this repo.
  ios-release:
    name: Realmate iOS Release (signed device build -> TestFlight)
    instance_type: mac_mini_m2      # M2 has Xcode + CocoaPods (same as ios-debug)
    max_build_duration: 60          # signing + archive + TestFlight upload is slower
    integrations:
      app_store_connect: Codemagic Realmate   # integration configured in the Codemagic UI
    environment:
      node: 20                      # Capacitor 7 needs Node 20+
      xcode: 26.4                   # pinned, NOT "latest"
      ios_signing:
        distribution_type: app_store          # automatic App Store / TestFlight signing
        bundle_identifier: com.realmate.app   # signs this bundle id
      vars:
        BUNDLE_ID: "com.realmate.app"
        APPLE_TEAM_ID: "RYT2TFV64G"           # team behind the "Codemagic Realmate" integration
        APP_STORE_APPLE_ID: 6802656686        # numeric App Store Connect app id (build-number lookup)
    # No 'triggering:' block => manual start only (no minutes until you click build).
    scripts:
      - name: Install JS dependencies (reproducible)
        script: npm ci
      - name: Generate iOS project in the cloud (Capacitor uses CI's CocoaPods)
        # ios/ is NOT committed; it is generated here where CocoaPods + Xcode exist.
        script: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios
      - name: Generate app icon + splash from assets/ (into the CI-generated ios project)
        # @capacitor/assets writes AppIcon + splash into ios/App/App/Assets.xcassets.
        # Runs AFTER 'npx cap add ios' (the project must exist) and before build.
        script: npx capacitor-assets generate --ios
      - name: Set required Info.plist keys (export compliance + camera/photo usage)
        # ios/App/App/Info.plist is generated (not committed). Set export compliance
        # to avoid the "Missing Compliance" TestFlight hold, AND the camera/photo
        # usage strings the registration (Alveo ID) + composer photo pickers need:
        # a web <input type=file> invokes the native picker, and without these keys
        # iOS hard-crashes on the first photo tap and App Review rejects the build.
        script: |
          PLIST=ios/App/App/Info.plist
          plist_set() {
            /usr/libexec/PlistBuddy -c "Add :$1 $2 $3" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Set :$1 $3" "$PLIST"
          }
          plist_set ITSAppUsesNonExemptEncryption bool false
          plist_set NSCameraUsageDescription string "Realmate uses the camera so you can take and upload photos of your property listings and verification documents."
          plist_set NSPhotoLibraryUsageDescription string "Realmate accesses your photos so you can attach listing images and upload your Alveo ID for account verification."
      - name: Apply App Store signing profiles fetched via the integration
        # Pulls/creates the distribution cert + provisioning profile (team RYT2TFV64G)
        # using the App Store Connect API key, then writes them into the Xcode project.
        script: xcode-project use-profiles
      - name: Set a unique, incrementing build number (based on latest TestFlight build)
        script: |
          cd ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)
          if [ -z "$LATEST_BUILD_NUMBER" ]; then LATEST_BUILD_NUMBER=0; fi
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Build signed IPA (Release configuration, device / iphoneos)
        # build-ipa archives for a real device (iphoneos, NOT iphonesimulator)
        # and exports a signed .ipa using the applied App Store profile.
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App \
            --config Release
    artifacts:
      - build/ios/ipa/*.ipa                   # the signed .ipa
      - /tmp/xcodebuild_logs/*.log            # build logs (for debugging failures)
    publishing:
      app_store_connect:
        auth: integration           # authenticate with the "Codemagic Realmate" API key
        submit_to_testflight: true  # upload the .ipa and release it to TestFlight
